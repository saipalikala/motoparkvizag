<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfbf7" />
    <title>MotoPark — Premium Motorcycle Gear, Pan-India</title>

    <!-- LCP preload. The homepage hero is the LCP element on "/", and it used to
         be discoverable only after index.js + HomePage.js had downloaded, parsed
         and executed (it was a JS `import`). These links let the browser's preload
         scanner start the fetch from the raw HTML instead, before any bundle runs.
         `type` means non-AVIF browsers skip them and fall back to the <picture>
         in Hero.jsx without wasting a request.

         Selection is by `media`, matching Hero.jsx exactly. Do NOT switch these
         to imagesrcset/imagesizes: with width-descriptors the scanner and the
         layout engine can pick different variants and download the LCP image
         twice (measured). Change these breakpoints and Hero.jsx together. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero-960.avif"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero-1600.avif"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <!-- Static hero shell (docs/13 §3d). The preload above makes the hero BYTES
         arrive at ~245-633 ms, but the <img> does not exist until React boots
         and renders HomePage — so it does not PAINT until ~3.9 s. This paints
         the same image straight from the HTML, before any bundle runs.

         Geometry is duplicated from Hero.module.css deliberately: it must be
         byte-identical in effect, because Hero.jsx renders the same image in the
         same box moments later and any difference becomes a visible jump.
         Change these together — 82vh mobile / 80vh from 768px, object-position
         center 30%, and the scrim gradients.

         `position: absolute` (not fixed) keeps it out of flow, so it cannot
         shift #root content — CLS is currently a perfect 0 and must stay there —
         and it scrolls away naturally if the user scrolls before React boots. -->
    <style>
      #hero-shell {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 82vh;
        overflow: hidden;
        background: #141c29; /* --bg-inverse-deep, so there is never a white flash */
      }
      #hero-shell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
      }
      #hero-shell-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to top,
            rgb(20 28 41 / 0.92) 0%,
            rgb(20 28 41 / 0.62) 38%,
            rgb(20 28 41 / 0.28) 70%,
            rgb(20 28 41 / 0.15) 100%
          ),
          linear-gradient(to right, rgb(20 28 41 / 0.55), transparent 60%);
      }
      @media (min-width: 768px) {
        #hero-shell { height: 80vh; }
      }
    </style>

    <meta
      name="description"
      content="Genuine motorcycle helmets, riding gear, luggage and parts. The right gear for your ride — shipped across India from Visakhapatnam."
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MotoPark" />
    <meta property="og:title" content="MotoPark — Genuine Motorcycle Gear, Pan-India" />
    <meta property="og:description" content="Genuine motorcycle helmets, riding gear, luggage and parts — shipped across India from Visakhapatnam." />
    <meta property="og:url" content="https://motoparkvizag.in/" />
    <meta property="og:image" content="https://motoparkvizag.in/og-image.jpg" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MotoPark — Genuine Motorcycle Gear, Pan-India" />
    <meta name="twitter:description" content="Genuine motorcycle helmets, riding gear, luggage and parts — shipped across India from Visakhapatnam." />
    <meta name="twitter:image" content="https://motoparkvizag.in/og-image.jpg" />
  </head>
  <body>
    <!-- Mirrors the <picture> in Hero.jsx exactly, including the source ORDER
         and the media-query selection. Same URLs, so React's hero reuses these
         bytes from cache rather than fetching again. aria-hidden + empty alt:
         it is pure decoration and Hero.jsx owns the real content. -->
    <div id="hero-shell" aria-hidden="true">
      <picture>
        <source type="image/avif" media="(max-width: 767px)" srcset="/hero-960.avif" />
        <source type="image/avif" media="(min-width: 768px)" srcset="/hero-1600.avif" />
        <source type="image/webp" media="(max-width: 767px)" srcset="/hero-960.webp" />
        <source type="image/webp" media="(min-width: 768px)" srcset="/hero-1600.webp" />
        <img src="/hero-1600.jpg" alt="" width="1600" height="900" fetchpriority="high" decoding="async" />
      </picture>
      <div id="hero-shell-scrim"></div>
    </div>
    <script>
      // index.html is shared by every route, so the shell would otherwise paint
      // a full-screen hero over /store, /cart, /account and the rest. Runs
      // during parse — the node is gone before first paint, so it never flashes.
      // Hero.jsx removes it on the home route once the real hero is up.
      if (location.pathname !== '/') {
        document.getElementById('hero-shell')?.remove();
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
